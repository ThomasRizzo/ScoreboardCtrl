[package]
name = "scoreboard-bootloader"
version = "0.1.0"
edition = "2021"
publish = false
description = "embassy-boot bootloader for ScoreboardCtrl (Pico W / RP2040)"

[dependencies]
# Match embassy-boot RP example: no time-driver. A TIMER IRQ left enabled
# across load() can HardFault the app before USB comes up.
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt"] }
embassy-boot-rp = { version = "0.10.0", features = ["defmt"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embedded-storage = "0.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

