<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0c">
    <title>Scoreboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #1c1c20;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px;
            padding-bottom: 24px;
            color: #ddd;
        }
        .container {
            background: linear-gradient(180deg, #2c2c32 0%, #141418 28%, #0a0a0c 100%);
            border-radius: 22px;
            border: 4px solid #0e0e10;
            box-shadow:
                inset 0 1px 0 #5a5a62,
                0 10px 28px rgba(0, 0, 0, 0.55);
            padding: 12px 14px 16px;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #f4f4f4;
            margin-bottom: 2px;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .badge {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #888;
        }
        .badge.sim { color: #ffb000; }
        .url-hint {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
        }
        .url-hint a { color: #ffb000; font-weight: 700; text-decoration: none; }
        .refresh-link {
            display: block;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #d4a84b;
            background: #2a2a30;
            border: 1px solid #3a3a22;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer-section, .timer-set-section {
            background: #050506;
            border-radius: 10px;
            padding: 10px 8px;
            margin-bottom: 8px;
            text-align: center;
            border: 1px solid #222;
        }
        .led {
            display: inline-block;
            font-family: "Courier New", Courier, monospace;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.08em;
            line-height: 1;
        }
        .led.amber { color: #ffb000; text-shadow: 0 0 6px #ff8c00, 0 0 16px rgba(255, 120, 0, 0.7); }
        .led.red { color: #ff2a14; text-shadow: 0 0 6px #ff1a00, 0 0 14px rgba(255, 0, 0, 0.65); }
        .timer-display {
            font-size: clamp(44px, 16vw, 72px);
            margin: 4px 0 10px;
        }
        .timer-controls, .led-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: nowrap;
        }
        button {
            padding: 10px 14px;
            font-size: 14px;
            min-height: 44px;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            background: #2a2a30;
            color: #eee;
        }
        button:active { opacity: 0.75; }
        .btn-primary { background: #3a3a42; color: #ffb000; border-color: #554400; }
        .btn-success { background: #1a3a18; color: #7dff6a; border-color: #2a5a22; }
        .btn-danger { background: #3a1210; color: #ff6a5a; border-color: #5a2018; }
        .btn-warning { background: #3a2a08; color: #ffb000; border-color: #5a4400; }
        .btn-led { background: #2a2a30; color: #bbb; }
        .timer-set-group {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }
        .input-group label {
            font-size: 18px; font-weight: 700; color: #aaa;
        }
        .input-group input {
            padding: 8px; border: 1px solid #333; border-radius: 4px; font-size: 20px; width: 64px;
            background: #111; color: #ffb000; font-family: "Courier New", monospace; font-weight: 700;
            text-align: center;
        }
        .scores-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .score-box {
            background: #050506;
            border-radius: 10px;
            padding: 8px 6px 10px;
            text-align: center;
            border: 1px solid #222;
        }
        .score-label {
            font-size: 14px;
            font-weight: 800;
            color: #f4f4f4;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .score-display {
            font-size: clamp(40px, 14vw, 64px);
            margin: 4px 0 8px;
        }
        .score-controls { display: flex; gap: 8px; justify-content: center; }
        .btn-score { flex: 0 0 48px; width: 48px; height: 48px; min-height: 48px; font-size: 26px; padding: 0; }
        .score-clear {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }
        .score-clear button {
            flex: 0 1 auto;
            text-align: center;
        }
        .status { text-align: center; color: #888; font-size: 12px; min-height: 16px; margin-top: 4px; }
        .status.err { color: #ff6a5a; }
        .dev-bar {
            display: flex;
            justify-content: center;
            margin-top: 12px;
        }
        .btn-dev {
            flex: 0 0 auto;
            min-height: 32px;
            padding: 6px 14px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #666;
            background: transparent;
            border-color: #333;
        }
        .dev-panel[hidden] { display: none; }
        .led-section {
            background: #121214;
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
            text-align: center;
            border: 1px solid #222;
        }
        .led-section h2 {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .build {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 16px;
            font-family: "Courier New", Courier, monospace;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scoreboard</h1>
        <p class="url-hint">
            <a href="http://192.168.0.1/" target="_blank" rel="noopener">http://192.168.0.1</a>
            ·
            <a href="http://scoreboard.local/" target="_blank" rel="noopener">scoreboard.local</a>
        </p>
        <a class="refresh-link" href="http://192.168.0.1/">Refresh</a>
        <div class="badge" id="modeBadge">connecting…</div>

        <div class="timer-section">
            <div class="led amber timer-display" id="timerDisplay">07:30</div>
            <div class="timer-controls">
                <button class="btn-success" id="btnStart">Start</button>
                <button class="btn-danger" id="btnStop">Stop</button>
                <button class="btn-warning" id="btnReset">Reset</button>
            </div>
        </div>

        <div class="timer-set-section">
            <div class="timer-set-group">
                <div class="input-group">
                    <input type="number" id="inputMinutes" min="0" max="99" value="7" inputmode="numeric" aria-label="minutes">
                    <label for="inputMinutes">m</label>
                </div>
                <div class="input-group">
                    <input type="number" id="inputSeconds" min="0" max="59" value="30" inputmode="numeric" aria-label="seconds">
                    <label for="inputSeconds">s</label>
                </div>
                <button class="btn-warning" id="btnSetTimer" type="button">Set</button>
            </div>
        </div>

        <div class="scores-section">
            <div class="score-box home">
                <div class="score-label">Home</div>
                <div class="led red score-display" id="homeScore">00</div>
                <div class="score-controls">
                    <button class="btn-success btn-score" id="btnHomeInc">+</button>
                    <button class="btn-danger btn-score" id="btnHomeDec">−</button>
                </div>
            </div>
            <div class="score-box away">
                <div class="score-label">Guest</div>
                <div class="led red score-display" id="awayScore">00</div>
                <div class="score-controls">
                    <button class="btn-success btn-score" id="btnAwayInc">+</button>
                    <button class="btn-danger btn-score" id="btnAwayDec">−</button>
                </div>
            </div>
        </div>

        <div class="score-clear">
            <button class="btn-warning" id="btnScoresZero">Reset score</button>
        </div>

        <div class="status" id="status"></div>

        <div class="dev-bar">
            <button type="button" class="btn-dev" id="btnDev" aria-expanded="false">Dev</button>
        </div>
        <div id="devPanel" class="dev-panel" hidden>
            <div class="led-section">
                <h2>Onboard LED</h2>
                <div class="led-controls">
                    <button class="btn-led" id="btnLedOn">LED on</button>
                    <button class="btn-led" id="btnLedOff">LED off</button>
                    <button class="btn-led" id="btnAux">AUX</button>
                </div>
            </div>
            <div class="led-section">
                <h2>Firmware OTA</h2>
                <p class="hint" style="font-size:0.85rem;opacity:0.8;margin:0.25rem 0 0.5rem">Upload a <code>scoreboard-ctrl.bin</code> from <code>just ota-artifact</code>. Device will reboot.</p>
                <input type="file" id="otaFile" accept=".bin,application/octet-stream" />
                <div class="led-controls" style="margin-top:0.5rem">
                    <button class="btn-led" id="btnOta">Upload &amp; reboot</button>
                </div>
                <p class="status" id="otaStatus"></p>
            </div>
        </div>
        <p class="build" id="buildInfo"></p>
    </div>
    <script>
        const PERIOD_MIN = 7;
        const PERIOD_SEC = 30;

        let home = 0;
        let away = 0;
        let scoreInflight = 0;
        let lastMin = null;
        let lastSec = null;
        let audioCtx = null;

        function unlockAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function buzz() {
            if (!audioCtx) return;
            const ctx = audioCtx;
            const t0 = ctx.currentTime;
            const dur = 2.4;
            const osc = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc2.type = 'square';
            for (let i = 0; i < 12; i++) {
                const t = t0 + i * 0.2;
                const hi = (i % 2) === 0;
                osc.frequency.setValueAtTime(hi ? 980 : 740, t);
                osc2.frequency.setValueAtTime(hi ? 490 : 370, t);
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.32, t + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
            }
            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc2.start(t0);
            osc.stop(t0 + dur);
            osc2.stop(t0 + dur);
        }

        document.addEventListener('pointerdown', unlockAudio, { passive: true });

        function pad(n) { return String(n).padStart(2, '0'); }
        function fmt(min, sec) { return pad(min) + ':' + pad(sec); }
        function readSet() {
            const min = Math.max(0, Math.min(99, parseInt(document.getElementById('inputMinutes').value, 10) || 0));
            const sec = Math.max(0, Math.min(59, parseInt(document.getElementById('inputSeconds').value, 10) || 0));
            return { min, sec };
        }

        function renderScores() {
            document.getElementById('homeScore').textContent = pad(home);
            document.getElementById('awayScore').textContent = pad(away);
        }

        function post(path) {
            return fetch(path, { method: 'POST', cache: 'no-store' }).then((res) => {
                if (!res.ok) throw new Error(path + ' ' + res.status);
            });
        }

        function showErr(e) {
            document.getElementById('status').textContent = e.message || String(e);
            document.getElementById('status').className = 'status err';
        }

        function onTap(el, fn) {
            let locked = false;
            let startX = 0;
            let startY = 0;
            let tracking = false;
            el.addEventListener('pointerdown', (e) => {
                if (e.button != null && e.button !== 0) return;
                tracking = true;
                startX = e.clientX;
                startY = e.clientY;
                try { el.setPointerCapture(e.pointerId); } catch (_) {}
            });
            el.addEventListener('pointerup', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!tracking) return;
                tracking = false;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (dx * dx + dy * dy > 100) return;
                if (e.button != null && e.button !== 0) return;
                if (locked) return;
                locked = true;
                setTimeout(() => { locked = false; }, 280);
                fn();
            });
            el.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        }

        function bind(id, path) {
            onTap(document.getElementById(id), () => {
                post(path).catch(showErr);
            });
        }

        function bindScore(id, team, delta, path) {
            onTap(document.getElementById(id), () => {
                const cur = team === 'home' ? home : away;
                const next = Math.max(0, Math.min(99, cur + delta));
                if (next === cur) return;
                if (team === 'home') home = next;
                else away = next;
                scoreInflight += 1;
                renderScores();
                post(path)
                    .catch((e) => {
                        if (team === 'home') home = Math.max(0, Math.min(99, home - delta));
                        else away = Math.max(0, Math.min(99, away - delta));
                        renderScores();
                        showErr(e);
                    })
                    .finally(() => {
                        scoreInflight = Math.max(0, scoreInflight - 1);
                    });
            });
        }

        bind('btnStart', '/api/ctrl/start');
        bind('btnStop', '/api/ctrl/stop');
        bindScore('btnHomeInc', 'home', 1, '/api/ctrl/home-inc');
        bindScore('btnHomeDec', 'home', -1, '/api/ctrl/home-dec');
        bindScore('btnAwayInc', 'away', 1, '/api/ctrl/away-inc');
        bindScore('btnAwayDec', 'away', -1, '/api/ctrl/away-dec');
        onTap(document.getElementById('btnScoresZero'), () => {
            const prevHome = home;
            const prevAway = away;
            home = 0;
            away = 0;
            scoreInflight += 1;
            renderScores();
            post('/api/ctrl/scores-zero')
                .catch((e) => {
                    home = prevHome;
                    away = prevAway;
                    renderScores();
                    showErr(e);
                })
                .finally(() => {
                    scoreInflight = Math.max(0, scoreInflight - 1);
                });
        });
        bind('btnLedOn', '/led/on');
        bind('btnLedOff', '/led/off');
        bind('btnAux', '/api/ctrl/aux');
        onTap(document.getElementById('btnSetTimer'), () => {
            const { min, sec } = readSet();
            post('/api/timer/set/' + min + '/' + sec).catch(showErr);
        });
        document.getElementById('btnDev').addEventListener('click', () => {
            const panel = document.getElementById('devPanel');
            const btn = document.getElementById('btnDev');
            const open = panel.hasAttribute('hidden');
            if (open) panel.removeAttribute('hidden');
            else panel.setAttribute('hidden', '');
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });

        onTap(document.getElementById('btnReset'), () => {
            const live = document.getElementById('modeBadge').dataset.sim === '0';
            if (live) {
                post('/api/ctrl/reset').catch(showErr);
                return;
            }
            const { min, sec } = readSet();
            document.getElementById('timerDisplay').textContent = fmt(min, sec);
            lastMin = min;
            lastSec = sec;
            post('/api/timer/set/' + min + '/' + sec)
                .then(() => post('/api/ctrl/reset'))
                .catch(showErr);
        });

        async function updateStatus() {
            try {
                const response = await fetch('/api/status', { cache: 'no-store' });
                if (!response.ok) throw new Error('status ' + response.status);
                const data = await response.json();
                document.getElementById('timerDisplay').textContent = data.time;
                const parts = String(data.time).split(':');
                const min = parseInt(parts[0], 10) || 0;
                const sec = parseInt(parts[1], 10) || 0;
                if (lastMin === 0 && lastSec > 0 && lastSec <= 2 && min === 0 && sec === 0) {
                    buzz();
                }
                lastMin = min;
                lastSec = sec;
                if (scoreInflight === 0) {
                    home = Math.max(0, Math.min(99, data.home));
                    away = Math.max(0, Math.min(99, data.away));
                    renderScores();
                }
                const badge = document.getElementById('modeBadge');
                const setSection = document.querySelector('.timer-set-section');
                if (data.sim) {
                    badge.textContent = 'simulate — no scoreboard attached';
                    badge.className = 'badge sim';
                    badge.dataset.sim = '1';
                } else {
                    badge.textContent = 'live — UART + GPIO';
                    badge.className = 'badge';
                    badge.dataset.sim = '0';
                }
                if (setSection) setSection.style.display = '';
                document.getElementById('status').textContent =
                    (data.running ? 'running' : 'stopped') + ' · ' + (data.led ? 'LED on' : 'LED off');
                document.getElementById('status').className = 'status';
                const build = document.getElementById('buildInfo');
                if (build && data.ver) {
                    let t = 'v' + data.ver;
                    if (data.git) t += ' · ' + data.git;
                    if (data.date) t += ' · ' + data.date;
                    build.textContent = t;
                }
                return data;
            } catch (error) {
                document.getElementById('status').textContent = 'not connected';
                document.getElementById('status').className = 'status err';
                return null;
            }
        }

        function nextPollDelay(data, rtt) {
            if (!data || !data.running) return 350;
            if (typeof data.age_ms !== 'number') return 200;
            const period = 1000;
            const mid = 500;
            const age = Math.max(0, data.age_ms);
            let wait = mid - (age % period) - rtt / 2;
            if (wait < 80) wait += period;
            return Math.max(80, Math.min(1200, wait));
        }

        document.getElementById('btnOta').addEventListener('click', async () => {
            const input = document.getElementById('otaFile');
            const status = document.getElementById('otaStatus');
            const file = input.files && input.files[0];
            if (!file) {
                status.textContent = 'choose a .bin first';
                status.className = 'status err';
                return;
            }
            status.textContent = 'uploading ' + file.size + ' bytes…';
            status.className = 'status';
            try {
                const res = await fetch('/api/ota', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: file,
                    cache: 'no-store',
                });
                const text = await res.text();
                if (!res.ok) throw new Error(text || ('HTTP ' + res.status));
                status.textContent = 'OK — device rebooting';
                status.className = 'status';
            } catch (e) {
                status.textContent = String(e.message || e);
                status.className = 'status err';
            }
        });

        (function pollStatus() {
            const t0 = performance.now();
            updateStatus().then((data) => {
                const rtt = performance.now() - t0;
                setTimeout(pollStatus, nextPollDelay(data, rtt));
            });
        })();
    </script>
</body>
</html>
