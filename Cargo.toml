[package]
name = "ScoreboardCtrl"
version = "0.4.1"
edition = "2021"

[workspace]
members = [".", "bootloader"]
resolver = "2"

[lib]
name = "scoreboard_ctrl"
path = "src/lib.rs"

[[bin]]
name = "scoreboard-ctrl"
path = "src/main.rs"

[features]
default = ["simulate"]
# Software scoreboard (timer + scores) and onboard LED. Use when the SK2229R is not wired.
simulate = []
# embassy-boot A/B + HTTP POST /api/ota (ACTIVE image at 0x10009000).
ota = ["dep:embassy-boot-rp", "dep:embedded-storage"]
# USB CDC log + ENTERBOOTLOADER. Conflicts with the defmt log adapter; use for UF2 field flashes.
usb-log = ["dep:embassy-usb-logger"]

[dependencies]

[target.thumbv6m-none-eabi.dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
cyw43 = { version = "0.7.0", features = ["firmware-logs", "log"] }
cyw43-pio = "0.10.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-boot-rp = { version = "0.10.0", features = ["defmt"], optional = true }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "nightly"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "proto-ipv4", "medium-ethernet", "multicast"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "critical-section-impl", "time-driver", "defmt"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb-logger = { version = "0.6.0", optional = true }
embedded-storage = { version = "0.3.1", optional = true }
git-testament = { version = "0.2.6", default-features = false }
log = { version = "0.4.34", default-features = false }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
picoserve = { version = "0.20.0", features = ["embassy", "log", "json"] }
portable-atomic = { version = "1.15.0", features = ["critical-section"], default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"
